name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  shared:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run build -w @aieng/shared
      - run: npm run typecheck -w @aieng/shared

  api:
    needs: shared
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/api
    services:
      mongodb:
        image: mongo:7
        ports:
          - 27017:27017
      redis:
        image: redis:7
        ports:
          - 6379:6379
    env:
      NODE_ENV: test
      MONGO_URI: mongodb://127.0.0.1:27017/aieng_ci
      REDIS_URL: redis://127.0.0.1:6379
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run build -w @aieng/shared
      - run: npm run typecheck -w @aieng/api
      - run: npm run lint -w @aieng/api
      - run: npm run build -w @aieng/api
      - run: npm run test -w @aieng/api

  web:
    needs: shared
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run build -w @aieng/shared
      - run: npm run typecheck -w @aieng/web
      - run: npm run lint -w @aieng/web
