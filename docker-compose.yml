name: labpath

services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: labpath-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: labpath
      POSTGRES_PASSWORD: labpath
      POSTGRES_DB: labpath
    ports:
      - "5434:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./infra/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U labpath -d labpath"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: labpath-redis
    restart: unless-stopped
    ports:
      - "6382:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  sandbox-gateway:
    image: busybox:1.36
    container_name: labpath-sandbox-gateway
    restart: unless-stopped
    command: httpd -f -p 8080 -h /www
    volumes:
      - ./infra/sandbox/gateway-www:/www:ro
    networks:
      - sandbox
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/"]
      interval: 5s
      timeout: 3s
      retries: 5

volumes:
  postgres_data:

networks:
  sandbox:
    driver: bridge
    internal: true
