  <rect width="610" height="190" rx="24" fill="#0A0A0C"/>

  <g clip-path="url(#b1)"><use href="#stack"/></g>
  <g clip-path="url(#b2)"><use href="#stack" x="10"/></g>
  <g clip-path="url(#b3)"><use href="#stack"/></g>

  <text x="305" y="160" text-anchor="middle" font-family="'JetBrains Mono','SFMono-Regular',Consolas,monospace" font-size="14" letter-spacing="5" fill="#7D7D88">RAG · GUARDRAILS · EVALS</text>
